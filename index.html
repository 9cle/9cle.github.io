<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9cle's Repositories</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: auto; }
        h1 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        ul { list-style: none; padding: 0; }
        li { background: #f4f4f4; margin: 10px 0; padding: 15px; border-radius: 5px; }
        a { text-decoration: none; color: #0366d6; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .description { font-size: 0.9em; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>9cle's GitHub Repositories</h1>
    <ul id="repo-list">Loading repositories...</ul>

    <script>
        async function fetchRepos() {
            const username = '9cle';
            const repoList = document.getElementById('repo-list');

            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated`);
                
                if (!response.ok) throw new Error('Failed to fetch repos');
                
                const repos = await response.json();
                repoList.innerHTML = ''; // Clear the loading message

                repos.forEach(repo => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `
                        <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                        <div class="description">${repo.description || 'No description provided.'}</div>
                    `;
                    repoList.appendChild(listItem);
                });
            } catch (error) {
                repoList.innerHTML = '<li>Error loading repositories. Please try again later.</li>';
                console.error(error);
            }
        }

        fetchRepos();
    </script>
</body>
</html>
